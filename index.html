$('sound').onclick=()=>{if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio=new A()}audio.resume();sound=!sound;$('sound').textContent=tr(sound?'音效 開':'音效 關');$('sound').setAttribute('aria-pressed',sound);beep(700)};
function reset(){g={x:200,y:509,hp:3,score:0,inv:[0,0],boost:[0,0],time:0,zone:0,wave:0,next:.6,drop:6,heartDrop:random(10,16),shot:0,invul:0,fx:[0,0],enemies:[],fire:[],shots:[],items:[],bits:[],toast:'',toastTime:0};drag=null;keys.clear()}
function sync(){const n=String(g.score).padStart(6,'0');$('score').textContent=n;$('best').textContent=String(best).padStart(6,'0');$('life').textContent='♥ '.repeat(g.hp)+'♡ '.repeat(3-g.hp);$('capacity').textContent=(g.inv[0]+g.inv[1])+' / 5';buttons.forEach((b,i)=>{b.querySelector('i').textContent=g.inv[i];b.disabled=state!=='play'||!g.inv[i]});$('mini').textContent=state==='intro'?'':'♥ '+g.hp+'　'+n;$('stage').textContent=tr(state==='intro'?'待命中':zones[g.zone]);document.querySelectorAll('.route').forEach((el,i)=>el.classList.toggle('active',state!=='intro'&&i===Math.max(0,g.zone-1)));$('buff').textContent=state!=='play'?'':g.toastTime>0?tr(g.toast):g.boost.map((t,i)=>t>0?tr(['雙翼渦輪','MAGA'][i])+' '+Math.ceil(t)+'s':'').filter(Boolean).join('　')}
function overlay(title,button,hint){$('cover').hidden=false;document.querySelector('h1').textContent=tr(title);$('start').textContent=tr(button);$('hint').textContent=tr(hint)}
function start(){reset();state='play';$('cover').hidden=true;$('pause').hidden=false;sync()}
function pause(){if(state==='play'){state='paused';drag=null;keys.clear();overlay('飛行暫停','繼續飛行 ▸','準備好後繼續任務');$('pause').hidden=true;sync()}else if(state==='paused'){state='play';$('cover').hidden=true;$('pause').hidden=false;sync()}}
function finish(win){state=win?'won':'lost';if(g.score>best){best=g.score;try{localStorage.paperwingBest=best}catch{}}overlay(win?'航線突破':'任務結束','再次出擊 ▸',resultHint());$('pause').hidden=true;sync()}
$('start').disabled=true;artReady.then(()=>{artOK=true;$('start').disabled=false}).catch(()=>{loadFailed=true;$('hint').textContent=tr('圖像載入失敗，請重新整理')});$('start').onclick=()=>{if(state==='paused')pause();else start()};$('pause').onclick=pause;
function burst(x,y,color,n=12){for(let i=0;i<n;i++)g.bits.push({x,y,vx:random(-110,110),vy:random(-110,100),life:random(.25,.65),color})}
function use(i){if(state!=='play'||!g.inv[i])return;g.inv[i]--;g.boost[i]=10;g.fx[i]=1.6;burst(g.x,g.y-18,'#eaffff',30);beep(i?420:750,.3);sync()}
buttons.forEach((button,i)=>{
  // A second finger may never generate a click while the first is steering.
  button.onpointerdown=event=>{
    if(event.button!==0)return;
    event.preventDefault();
    use(i);
  };
  // Keyboard and assistive activation have no physical pointer press.
  button.onclick=event=>{if(event.detail===0&&!event.pointerType)use(i)};
});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();const k=e.key.toLowerCase();keys.add(k);if(e.repeat)return;if(k==='1'||k==='2')use(Number(k)-1);if(k==='p'||k==='escape')pause()});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{if(state==='play')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});
function pt(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
canvas.onpointerdown=e=>{if(state!=='play'||drag)return;canvas.setPointerCapture(e.pointerId);drag={id:e.pointerId,last:pt(e),x:g.x,y:g.y}};canvas.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;const p=pt(e);drag.x=clamp(drag.x+p.x-drag.last.x,24,376);drag.y=clamp(drag.y+p.y-drag.last.y,80,584);drag.last=p};canvas.onlostpointercapture=canvas.onpointercancel=canvas.onpointerup=e=>{if(drag?.id===e.pointerId)drag=null};
function enemy(kind,x,y,delay){const hp={scout:7,heavy:32,carrier:82}[kind];return {kind,x,home:x,y:-130,target:y,hp,max:hp,age:0,phase:random(0,6),timer:delay,turn:0,w:{scout:57,heavy:164,carrier:372}[kind]}}
function spawn(){const waves=[[['scout',200,115]],[['scout',76,109],['scout',200,69],['scout',324,109]],[['heavy',200,110]],[['carrier',200,132]]];g.enemies=waves[g.zone].map(([k,x,y],i)=>enemy(k,x,y,0.12+i*.45));g.wave=1}
function hit(){if(g.invul||state!=='play')return;g.hp--;g.invul=1.7;burst(g.x,g.y,'#ff9e54',22);beep(125,.3);if(!g.hp)finish(false);sync()}
function volley(e){const t=e.kind,origin=e.y+(t==='carrier'?100:t==='heavy'?40:12);const launch=(x,vx,vy)=>g.fire.push({x,y:origin,vx,vy,missile:t==='scout'});if(t==='scout'){const aim=clamp((g.x-e.x)*.25,-65,65);for(const s of [-1,1])launch(e.x+s*19,aim+s*13,155);e.timer=2.4}else{const n=t==='carrier'?7:5;for(let i=0;i<n;i++){let v=(i-(n-1)/2);launch(e.x+v*(t==='carrier'?26:8),v*33+Math.sin(e.turn)*15,140-Math.abs(v)*5)}e.timer=t==='carrier'?1.65:1.95;if(t==='carrier'&&++e.turn%4===0&&g.enemies.length<3){g.enemies.push(enemy('scout',e.turn%8?74:326,202,1.6))}else if(t==='heavy')e.turn++} }
function update(dt){g.time+=dt;g.invul=Math.max(0,g.invul-dt);g.toastTime-=dt;for(let i=0;i<2;i++){g.boost[i]=Math.max(0,g.boost[i]-dt);g.fx[i]=Math.max(0,g.fx[i]-dt)}
const down=(...a)=>a.some(k=>keys.has(k));let dx=Number(down('d','arrowright'))-Number(down('a','arrowleft')),dy=Number(down('s','arrowdown'))-Number(down('w','arrowup'));let speed=235*(1+(g.boost[0]>0)*.45+(g.boost[1]>0)*.3);if(dx||dy){let l=Math.hypot(dx,dy);g.x+=dx/l*speed*dt;g.y+=dy/l*speed*dt}else if(drag){let a=drag.x-g.x,b=drag.y-g.y,l=Math.hypot(a,b);if(l){let f=Math.min(1,speed*dt/l);g.x+=a*f;g.y+=b*f}}g.x=clamp(g.x,25,375);g.y=clamp(g.y,80,584);
if(!g.wave&&(g.next-=dt)<=0)spawn();if((g.shot-=dt)<=0){g.shot=.22;g.shots.push({x:g.x,y:g.y-17,big:g.boost[0]>0,dmg:g.boost[1]>0?3:1})}if((g.drop-=dt)<=0){g.drop=random(6.5,11);g.items.push({x:random(35,365),y:-20,i:Math.random()<.5?0:1})}
if((g.heartDrop-=dt)<=0){
  g.heartDrop=random(10,16);
  g.items.push({kind:'heart',x:random(30,W-30),y:-20});
}
for(const e of g.enemies){e.age+=dt;e.y=Math.min(e.target,e.y+dt*(e.kind==='carrier'?53:110));e.x=e.home+Math.sin(e.age*(e.kind==='scout'?1.1:.65)+e.phase)*(e.kind==='carrier'?8:e.kind==='heavy'?57:30);if(e.y>=Math.min(40,e.target)&&(e.timer-=dt)<=0)volley(e);if(Math.abs(e.x-g.x)<e.w*.41&&Math.abs(e.y-g.y)<e.w*(e.kind==='carrier'?.29:.23)+8)hit()}
for(const s of g.shots){s.y-=dt*450;for(const e of g.enemies){if(e.hp<=0||e.y<0)continue;if(Math.abs(s.x-e.x)<e.w*.46+(s.big?10:3)&&Math.abs(s.y-e.y)<e.w*(e.kind==='carrier'?.30:.25)+7){e.hp-=s.dmg;s.y=-999;burst(s.x,e.y+12,'#fadd79',3);if(e.hp<=0){g.score+=e.kind==='carrier'?2000:e.kind==='heavy'?600:100;burst(e.x,e.y,'#ffb064',27);beep(190);if(e.kind==='carrier'&&state==='play'){finish(true);return}}break}}}
g.enemies=g.enemies.filter(e=>e.hp>0);if(g.wave&&!g.enemies.length&&g.zone<3){g.zone++;g.wave=0;g.next=1.15}
for(const f of g.fire){f.x+=f.vx*dt;f.y+=f.vy*dt;if(Math.hypot(f.x-g.x,f.y-g.y)<13){f.y=999;hit()}}
for(const p of g.items){p.y+=83*dt;
  if(p.kind==='heart'){
    if(state==='play' && Math.hypot(p.x-g.x,p.y-g.y)<34){
      const damaged=g.hp<3;
      g.hp=Math.min(3,g.hp+1);
      g.toast=damaged?'機體耐久 +1':'機體耐久已滿';
      g.toastTime=1.4;
      burst(p.x,p.y,'#ff99ad',14);
      beep(1050,.16);
      p.y=999;
    }
    continue;
  }
  if(Math.hypot(p.x-g.x,p.y-g.y)<37&&g.inv[0]+g.inv[1]<5){g.inv[p.i]++;p.y=999;g.toast='已收集'+['黃仁勳','川普'][p.i]+'膠囊';g.toastTime=1.1;beep(920)}}
g.items=g.items.filter(p=>p.y<650);g.shots=g.shots.filter(p=>p.y>-25);g.fire=g.fire.filter(p=>p.y<650&&p.x>-12&&p.x<412);for(const b of g.bits){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}g.bits=g.bits.filter(b=>b.life>0);sync()}
function drawHeart(p){
  c.save();
  c.translate(p.x,p.y);
  const pulse=1+.05*Math.sin(clock*6);
  c.scale(pulse,pulse);
  c.beginPath();
  c.moveTo(0,15);
  c.bezierCurveTo(-29,-3,-13,-23,0,-12);
  c.bezierCurveTo(13,-23,29,-3,0,15);
  c.closePath();
  c.fillStyle='#de405d';
  c.fill();
  c.strokeStyle='#fff5d8';
  c.lineWidth=2.5;
  c.stroke();
  c.fillStyle='#fff5d8';
  c.fillRect(-5,-4,10,3);
  c.fillRect(-1.5,-7.5,3,10);
  c.restore();
}
function sprite(name,x,y,w,flip=false){const a=assets[name];if(!a?.naturalWidth)return;c.save();c.translate(x,y);if(flip)c.scale(-1,1);const h=w*a.naturalHeight/a.naturalWidth;c.drawImage(a,-w/2,-h/2,w,h);c.restore()}
const sky=c.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#458cb0');sky.addColorStop(.55,'#8bc9d6');sky.addColorStop(1,'#d3e6d8');
const clouds=[[-10,5,1],[381,78,.85],[10,255,.55],[373,333,1.24],[10,475,1.1],[302,610,.47],[128,180,.28]];
function cloud(x,y,s){c.save();c.translate(x,y);c.scale(s,s);c.beginPath();c.moveTo(-65,17);c.bezierCurveTo(-83,14,-79,-6,-56,-10);c.bezierCurveTo(-48,-34,-22,-36,-9,-22);c.bezierCurveTo(0,-54,39,-55,47,-24);c.bezierCurveTo(66,-32,83,-10,73,1);c.bezierCurveTo(95,5,90,22,68,22);c.closePath();c.fillStyle='#c2d8da';c.fill();c.translate(0,-5);c.fillStyle='#f4efd9';c.fill();c.strokeStyle='#96b5ba';c.lineWidth=1.2;c.setLineDash([3,3]);c.stroke();c.restore()}
function backdrop(){c.fillStyle=sky;c.fillRect(0,0,W,H);c.save();c.strokeStyle='#ffffff13';for(let i=0;i<17;i++){let x=(i*87)%410,y=(i*167+clock*75)%690-45;c.beginPath();c.moveTo(x,y);c.lineTo(x-4,y+30);c.stroke()}c.restore();for(const [x,y,s] of clouds)cloud(x,(y+clock*(10+8*s)+55)%735-55,s)}
function leaf(x,y,big){c.save();c.translate(x,y);for(let i=0;i<(big?5:2);i++){let d=i-(big?2:.5);c.fillStyle=['#317736','#6fb93c','#d2ea81'][i%3];c.beginPath();c.moveTo(d*1.3,6);c.quadraticCurveTo(d*4-4,-4,d*(big?6:4),big?-31:-14);c.quadraticCurveTo(d*2+2,-9,d*1.3+2,6);c.fill()}c.restore()}
function missile(f){c.save();c.translate(f.x,f.y);c.rotate(-Math.atan2(f.vx,f.vy));c.fillStyle='#ffca62';c.beginPath();c.moveTo(-3,-5);c.lineTo(0,-17-Math.sin(clock*30)*3);c.lineTo(3,-5);c.fill();if(f.missile){c.fillStyle='#594d48';c.fillRect(-5,-6,10,4);c.fillStyle='#f5ead0';c.fillRect(-3,-7,6,12)}c.fillStyle='#eb593e';c.beginPath();c.moveTo(-3,3);c.lineTo(0,10);c.lineTo(3,3);c.fill();c.restore()}
function enemyArt(e){
  if(e.kind!=='carrier')return e.kind;
  if(e.hp*3<=e.max)return 'carrierThird';
  if(e.hp*2<=e.max)return 'carrierHalf';
  return 'carrier';
}
function draw(){backdrop();if(state==='intro'){c.save();c.translate(200,326+Math.sin(clock*1.7)*5);c.rotate(Math.sin(clock*.9)*.035);sprite('pilot',0,0,278);c.restore();return}
for(const e of g.enemies){sprite(enemyArt(e),e.x,e.y,e.w);if(e.kind!=='scout'&&e.y>0){const w=e.kind==='carrier'?150:65,y=e.y+e.w*.35;c.fillStyle='#294453';c.fillRect(e.x-w/2,y,w,4);c.fillStyle='#ffb058';c.fillRect(e.x-w/2,y,w*e.hp/e.max,4)}}
for(const f of g.fire)missile(f);for(const s of g.shots)leaf(s.x,s.y,s.big);for(const p of g.items){if(p.kind==='heart'){drawHeart(p);continue}c.save();c.shadowColor='#fff5b0';c.shadowBlur=10;sprite(p.i?'trump':'jensen',p.x,p.y,40);c.restore()}
c.save();if(g.invul&&Math.floor(g.invul*10)%2)c.globalAlpha=.45;sprite('pilot',g.x,g.y,76);if(g.boost[0]>0){sprite('gpu',g.x-25,g.y+2,17);sprite('gpu',g.x+25,g.y+2,17,true)}if(g.boost[1]>0){c.fillStyle='#fff2c8';c.fillRect(g.x-10,g.y-2,20,8);c.font='bold 7px sans-serif';c.textAlign='center';c.fillStyle='#b82826';c.fillText('MAGA',g.x,g.y+5)}c.restore();
for(const b of g.bits){c.globalAlpha=Math.min(1,b.life*3);c.fillStyle=b.color;c.fillRect(b.x,b.y,3,3)}c.globalAlpha=1;
if(g.fx[0]>0){c.save();c.globalAlpha=Math.min(.76,g.fx[0]);sprite('ghost',clamp(g.x,60,340),Math.max(55,g.y-78),101);c.restore()}if(g.fx[1]>0){c.save();c.globalAlpha=Math.min(1,g.fx[1]*1.4);c.textAlign='center';c.font='1000 31px system-ui';c.lineWidth=4;c.strokeStyle='#fff3de';const x=clamp(g.x,58,342),y=g.y-50-(1.6-g.fx[1])*16;c.strokeText('MAGA',x,y);c.fillStyle='#b8363c';c.fillText('MAGA',x,y);c.restore()}}
function frame(now){let dt=Math.min(.04,(now-last)/1000);last=now;if(state==='intro'||state==='play')clock+=dt;if(state==='play')update(dt);draw();requestAnimationFrame(frame)}reset();refreshLanguage();requestAnimationFrame(frame);
</script></body></html>
